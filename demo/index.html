  <body>
    <main id="demo">
      <noscript>
        <h1>Patchwork</h1>
        <p>
          An FFGL effect that puts your clip on an LED wall built the way real
          ones are: cabinets on a daisy-chained cable, each with its own
          receiving card, calibration table and scan-driven modules. Every fault
          is one stage of that chain lying, so the decalibrated patchwork, tiles
          repeated and flowing along the cable, everything downstream of a break
          going black or freezing, a cut rippling down the chain, zebra stripes
          from a stuck address line, a colour missing from one driver chip
          onwards, and supplies sagging and tripping all come out of the chain
          rather than being drawn on top.
        </p>
        <p>
          This demo runs the plugin's shaders and a port of its CPU half in your
          browser, so it needs JavaScript and WebGL2. The plugin itself, its
          source and its downloads are on
          <a href="https://github.com/stoatworks-labs/patchwork">its repository</a>.
        </p>
        <ul>
          <li><a href="https://stoatworks-labs.com/software/patchwork/">Project page and downloads</a></li>
